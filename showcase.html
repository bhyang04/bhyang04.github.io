---
layout: page
title: Showcase
permalink: /showcase/
---

<link rel="stylesheet" href="{{ "/assets/css/gallery.css" | relative_url }}">
<link rel="stylesheet" href="{{ "/assets/css/cards.css" | relative_url }}">

{% assign cards = site.showcase | where: "show", true | sort: "date" | reverse | group_by: "group" %}
{% for group in cards %}
<h2>{{ group.name }}</h2>
<div class="showcase-grid">
{% for item in group.items %}<div class="card education-card showcase-card">{{ item.content }}</div>{% endfor %}
</div>
{% endfor %}
