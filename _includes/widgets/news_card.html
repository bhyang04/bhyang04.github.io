{% assign news_items = site.news | sort: "date" | reverse | slice: 0, include.limit -%}

<div class="my-3 bg-white shadow-sm rounded-xl news-card">
    <h5 class="p-3 mb-0 border-bottom border-gray"><i class="fas fa-rss"></i> News</h5>
    <div class="px-3 pb-2 news-list">
        {% for item in news_items %}
        <div class="py-3 d-flex align-items-start news-item {% if not_first -%}border-top border-gray{%- endif %}">
            {% assign not_first = true %}
            <div class="news-title">{{ item.title }}</div>
            <div class="ml-auto pl-3 text-muted no-break news-date"><i>{{ item.date | date: "%b %d, %Y" }}</i></div>
        </div>
        {% endfor %}
    </div>
</div>
