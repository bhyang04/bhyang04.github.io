---
layout: page
title: Blog
permalink: /blog/
---

<link rel="stylesheet" href="{{ "/assets/css/cards.css" | relative_url }}">

{% assign visible_posts = site.posts | where_exp: "item", "item.hidden != true" %}
{% for post in visible_posts %}
<div class="news-row"><div><h3><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h3><p class="text-muted small">{{ post.date | date: '%B %d, %Y' }}</p>{{ post.excerpt }}</div></div>
{% endfor %}
